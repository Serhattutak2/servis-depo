<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Servis Depo</title>
<link rel="stylesheet" href="vendor/fonts.css">
<script src="vendor/jsQR.js"></script>
<script src="vendor/zxing.min.js"></script>
<script src="vendor/qrcode.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one-column shop-floor app. Every screen asks one question with one big button; fixed 3-tab bar with a raised scan key. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --sunk:#E1E6E9; --ink:#162027; --muted:#56646C; --line:#CDD5DA;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE3D6;
  --ok:#23763A; --ok-soft:#DCF0E1; --warn:#A35A00; --warn-soft:#FBEBCF; --bad:#B42318; --bad-soft:#F9DDDA;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171B; --surface:#192127; --sunk:#0D1215; --ink:#E4EAED; --muted:#93A1A9; --line:#2B363D;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --accent-soft:#3A2116;
  --ok:#5CCB7A; --ok-soft:#173222; --warn:#F2B04A; --warn-soft:#3A2B12; --bad:#FF7B70; --bad-soft:#3D1A17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171B; --surface:#192127; --sunk:#0D1215; --ink:#E4EAED; --muted:#93A1A9; --line:#2B363D;
  --accent:#FF7A3D; --accent-ink:#1A0D05; --accent-soft:#3A2116;
  --ok:#5CCB7A; --ok-soft:#173222; --warn:#F2B04A; --warn-soft:#3A2B12; --bad:#FF7B70; --bad-soft:#3D1A17; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.tag{font-family:var(--mono);font-size:13px;font-weight:700;border:1.5px solid var(--ink);border-radius:5px;padding:1px 7px;line-height:1.4;display:inline-block;white-space:nowrap}
.spacer{flex:1}
h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:28px;text-transform:uppercase;line-height:1.05}
h3{font-size:19px;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
main{padding-block:16px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--body);padding:10px 16px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.btn.big{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;width:100%;min-height:64px}
.btn.link{border:0;background:none;color:var(--accent);min-height:40px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:22px;height:22px;flex:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.tile:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
input,select,textarea{font:17px var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input.huge{font-size:20px;padding:16px;border-radius:12px;background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:18px 14px;display:grid;gap:8px;justify-items:start;text-align:left;cursor:pointer;font:inherit;min-height:132px;align-content:space-between}
.tile svg{width:34px;height:34px}
.tile b{font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.tile span{font-size:13px;color:var(--muted)}
.tile.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.pri span{color:var(--accent-ink);opacity:.85}
.today{display:flex;gap:18px;flex-wrap:wrap;font-size:15px}
.today b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums;margin-right:4px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.neu{background:var(--sunk);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;font:inherit;width:100%}
.item:first-child{border-top:0}
button.item:hover{background:var(--sunk)}
.item .t{font-weight:700}
.item .s{font-size:14px;color:var(--muted)}
.qty{font-family:var(--display);font-size:30px;font-weight:700;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.qty small{display:block;font-family:var(--body);font-size:12px;font-weight:500;color:var(--muted)}
.qty.bad{color:var(--bad)} .qty.warn{color:var(--warn)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.prog{display:flex;gap:6px}
.prog i{height:6px;flex:1;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.ask{font-family:var(--display);font-size:30px;font-weight:700;text-transform:uppercase;line-height:1.05;text-wrap:balance}
.notice{border-radius:10px;padding:12px 14px;font-size:15px}
.notice.bad{background:var(--bad-soft);color:var(--bad)} .notice.warn{background:var(--warn-soft);color:var(--warn)} .notice.ok{background:var(--ok-soft);color:var(--ok)} .notice.info{background:var(--sunk);color:var(--muted)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.stepper button{border:0;background:var(--sunk);color:var(--ink);width:60px;height:60px;font-size:28px;cursor:pointer}
.stepper input{width:84px;border:0;border-radius:0;text-align:center;font-family:var(--display);font-size:30px;font-weight:700;background:var(--surface)}
.shelfchip{font-family:var(--mono);font-weight:700;font-size:14px;background:var(--sunk);border-radius:6px;padding:2px 8px;white-space:nowrap}
.shelfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.shelf{border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:var(--surface);cursor:pointer;color:inherit;font:inherit}
.shelf b{font-family:var(--display);font-size:26px;display:block;line-height:1}
.shelf span{font-size:12px;color:var(--muted)}
.prodhead{display:flex;gap:12px;align-items:center}
.prodhead .t{font-family:var(--display);font-size:24px;font-weight:700;line-height:1.1}
.success{text-align:center;display:grid;gap:14px;justify-items:center;padding-block:10px}
.success .mark{width:84px;height:84px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center}
.success .mark svg{width:48px;height:48px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);align-items:end;padding-block:6px}
.tab{border:0;background:none;color:var(--muted);font:700 12px var(--body);letter-spacing:.05em;text-transform:uppercase;display:grid;justify-items:center;gap:3px;padding:4px 0;cursor:pointer;min-height:52px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.scan .disc{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 0 0 5px var(--surface)}
.tab.scan .disc svg{width:30px;height:30px}
.sheetbg{position:fixed;inset:0;background:rgba(10,14,17,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding-top:16px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet .hd{display:flex;align-items:center;gap:8px}
.labelimg{width:100%;max-width:420px;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;z-index:30;font-weight:600;max-width:calc(100% - 32px)}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 14px;font:600 14px var(--body);cursor:pointer}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.sectionhd{display:flex;align-items:baseline;gap:8px;justify-content:space-between;flex-wrap:wrap}
.wo{border-left:5px solid var(--line)}
.wo.s-acik{border-left-color:var(--accent)} .wo.s-devam{border-left-color:var(--warn)} .wo.s-bekliyor{border-left-color:var(--muted)} .wo.s-tamam{border-left-color:var(--ok)}
details.more summary{cursor:pointer;font-weight:600;color:var(--accent);padding:6px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}
.price{width:104px;flex:none;text-align:right;padding:8px 10px;font-variant-numeric:tabular-nums}
.totrow{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totrow.grand{border-top:1.5px solid var(--ink);padding-top:8px;margin-top:4px;font-family:var(--display);font-size:28px;font-weight:700}
.totbig{display:grid;justify-items:center;gap:2px}
.totbig b{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.exp{border-color:var(--accent)}
.quote{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.item.sug{border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px}
.scanbox{display:flex;gap:12px;align-items:center}
.scanbox img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:var(--sunk)}
label.btn{user-select:none}
.steps-ol{margin:0;padding-left:22px;display:grid;gap:8px;font-size:15px}
.file-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.iconbtn{border:0;background:none;color:var(--ink);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:24px;height:24px}
.iconbtn:hover{background:var(--sunk)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.scanner{position:fixed;inset:0;background:#000;z-index:40}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanframe{position:absolute;left:10%;right:10%;top:32%;height:24%;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}
.scanframe.wide{top:18%;height:52%;left:6%;right:6%}
.scanframe::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#FF7A3D;box-shadow:0 0 10px #FF7A3D}
.scanframe.wide::after{display:none}
.scanbar{position:absolute;left:0;right:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scanbar.top{top:0;padding-top:calc(18px + env(safe-area-inset-top,0px));color:#fff;font:600 17px var(--body);text-align:center;text-shadow:0 1px 3px #000}
.scanbar.bottom{bottom:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.scanbar .btn{min-width:96px}
.ocrwords .chipbtn{font-family:var(--mono);font-size:13px}
</style>
</head>
<body>


<header class="top"><div class="wrap">
  <div class="brand">Servis Depo<small>Malzeme · Raf · İş Emri</small></div>
  <div class="spacer"></div>
  <span id="conn" class="pill neu">Açılıyor</span>
  <button class="iconbtn" data-act="nav" data-v="ayar" aria-label="Raflar, rapor ve personel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</div></header>

<main class="wrap" id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Bölümler"><div class="wrap">
  <button class="tab" data-act="nav" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Depo</button>
  <button class="tab scan" data-act="nav" data-v="task" aria-label="Okut"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 12h8"/></svg></span>Okut</button>
  <button class="tab" data-act="nav" data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>İş Emri</button>
</div></nav>

<input type="file" id="cam" class="file-hidden" accept="image/*" capture="environment" aria-label="Fotoğraf çek">
<input type="file" id="gal" class="file-hidden" accept="image/*" aria-label="Galeriden seç">
<input type="file" id="restoreIn" class="file-hidden" accept=".json,application/json" aria-label="Yedek dosyası">
<div id="scanner" class="scanner" hidden>
  <video id="scanVideo" playsinline muted></video>
  <div id="scanFrame" class="scanframe"></div>
  <div class="scanbar top"><span id="scanHint"></span></div>
  <div class="scanbar bottom">
    <button class="btn" data-act="scan-close">Kapat</button>
    <button class="btn" id="scanTorch" data-act="torch" hidden>Fener</button>
    <label class="btn" for="gal">Galeri</label>
    <button class="btn pri" id="scanShot" data-act="scan-shot" hidden>Çek</button>
  </div>
</div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
"use strict";
const CATS=["Fren","Filtre","Yağ & Sıvı","Motor","Ateşleme & Elektrik","Süspansiyon & Direksiyon","Debriyaj & Şanzıman","Soğutma","Egzoz","Kaporta & Aydınlatma","Lastik & Jant","Sarf Malzeme","Diğer"];
const UNITS=["adet","takım","litre","kutu","metre","kg"];
const STATUS={acik:"Açık",devam:"Yapılıyor",bekliyor:"Parça bekliyor",tamam:"Bitti"};
const QUICK=["Yağ + filtre değişimi","Ön balata değişimi","Arka balata değişimi","Arıza tespiti","Rot-balans","Klima gazı","Akü kontrolü","Triger seti değişimi"];
const IC={
  in:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M12 13V8m0 5l-3-3m3 3l3-3"/></svg>`,
  out:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M12 8v5m0-5l-3 3m3-3l3 3"/></svg>`,
  find:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg>`,
  count:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>`,
  cam:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><path d="M8 12h8"/></svg>`,
  check:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>`,
};
const S={products:new Map(),vehicles:new Map(),shelves:new Map(),orders:new Map(),staff:new Map(),moves:[],settings:{},
  view:"home",task:null,q:"",woFilter:"aktif",sub:"raflar",month:new Date().toISOString().slice(0,7),
  lastPhoto:null,last:null,ready:false,offline:false};
let db=null,dl=null,ai=null,sheetOpen=false,wo=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const qtyOf=p=>Object.values(p?.locs||{}).reduce((a,b)=>a+(+b>0?+b:0),0);
const locsOf=p=>Object.entries(p?.locs||{}).filter(([,v])=>+v>0).sort((a,b)=>a[0].localeCompare(b[0],"tr",{numeric:true}));
const stat=p=>{const q=qtyOf(p),m=+p.min||0;return q<=0?["bad","Bitti"]:(m&&q<=m?["warn","Azaldı"]:["ok","Var"]);};
const unitOf=p=>p?.unit||"adet";
const fmtDate=ts=>new Date(ts).toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const monthName=ym=>new Date(ym+"-01T00:00").toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
const norm=s=>String(s||"").toLocaleLowerCase("tr").replace(/\s+/g," ").trim();
const plateKey=s=>String(s||"").toLocaleUpperCase("tr").replace(/[^A-Z0-9]/g,"");
const shelfCode=s=>String(s||"").toLocaleUpperCase("tr").replace(/[ÇĞİÖŞÜ]/g,c=>({Ç:"C",Ğ:"G",İ:"I",Ö:"O",Ş:"S",Ü:"U"}[c])).replace(/[^A-Z0-9-]/g,"");
const sortedShelves=()=>[...S.shelves.values()].sort((a,b)=>a.code.localeCompare(b.code,"tr",{numeric:true}));
const ym=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const sameDay=ts=>new Date(ts).toDateString()===new Date().toDateString();
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(40);}catch{}};

function toast(msg){const r=$("#toastRoot");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",2600);}
function fail(e,what){console.warn(e);toast((what||"İşlem")+" kaydedilemedi: "+(e?.code==="quota_exceeded"?"depolama dolu":"bağlantıyı kontrol edin"));}

function render(){
  const a=document.activeElement,id=a&&a.id,ss=a&&a.selectionStart,se=a&&a.selectionEnd;
  document.querySelectorAll(".tab").forEach(t=>{if(t.dataset.v===S.view)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current");});
  $("#view").innerHTML=({home:vHome,task:vTask,orders:vOrders,ayar:vAyar})[S.view]();
  if(id){const el=document.getElementById(id);if(el&&el.closest("#view")){el.focus();try{if(ss!=null)el.setSelectionRange(ss,se);}catch{}}}
  const c=$("#conn");
  if(S.offline){c.className="pill bad";c.textContent="Kayıt yok";}else if(S.ready){c.className="pill ok";c.textContent="Bu telefonda";}
}
function offlineNote(){return S.offline?`<div class="notice bad">Kayıtlar telefona yazılamıyor. Depolama alanını kontrol et.</div>`:(!S.ready?`<div class="notice info">Depo yükleniyor…</div>`:"");}

/* ================= DEPO (home) ================= */
function vHome(){
  const q=norm(S.q);
  const search=`<input id="q" class="huge" type="search" placeholder="Ne arıyorsun? ör. ford balata" value="${esc(S.q)}" data-in="q" autocomplete="off" enterkeyhint="search" aria-label="Malzeme ara">`;
  if(q){
    const words=q.split(" ");
    const res=[...S.products.values()].filter(p=>{const h=norm([p.name,p.brand,p.partNo,p.vehicle,p.category,(p.codes||[]).join(" ")].join(" "));return words.every(w=>h.includes(w));})
      .sort((a,b)=>qtyOf(b)-qtyOf(a)).slice(0,30);
    return `${offlineNote()}<section class="stack">${search}
      ${res.length?`<div class="list">${res.map(findItem).join("")}</div>`:`<div class="card empty">“${esc(S.q)}” depoda kayıtlı değil.<div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm" data-act="prod-new">Yeni ürün kartı aç</button></div></div>`}
    </section>`;
  }
  const prods=[...S.products.values()];
  const low=prods.filter(p=>stat(p)[0]!=="ok"&&(+p.min||0)>0);
  const td=S.moves.filter(m=>sameDay(m.ts));
  const inQ=td.filter(m=>m.type==="in").reduce((a,m)=>a+m.qty,0),outQ=td.filter(m=>m.type==="out").reduce((a,m)=>a+m.qty,0);
  const open=[...S.orders.values()].filter(o=>o.status!=="tamam").sort((a,b)=>b.createdAt-a.createdAt);
  return `${offlineNote()}
  <section class="stack">${search}</section>
  <section class="tiles">
    <button class="tile pri" data-act="task" data-k="in">${IC.in}<div><b>Malzeme geldi</b><br><span>Kutuyu okut, rafa koy</span></div></button>
    <button class="tile" data-act="task" data-k="out">${IC.out}<div><b>Malzeme al</b><br><span>Rafı okut, ürünü al</span></div></button>
  </section>
  ${prods.length&&(!S.settings.lastBackup||Date.now()-S.settings.lastBackup>7*864e5)?`<button class="notice warn item" style="border:0;border-radius:12px" data-act="backup"><div class="grow"><b>${S.settings.lastBackup?"Son yedek 7 günden eski":"Henüz yedek alınmadı"}</b><div style="font-size:14px">Telefon bozulursa kayıtlar gitmesin. Dokun, yedeği kendine gönder.</div></div><span class="btn sm">Yedek al</span></button>`:""}
  ${(()=>{const n=[...S.products.values()].filter(p=>!p.labeled&&qtyOf(p)>0).length;return n?`<button class="notice info item" style="border:0;border-radius:12px" data-act="unlabeled"><div class="grow"><b>${n} ürünün etiketi basılmadı</b><div style="font-size:14px">Etiketleri kaydet, yazıcıdan bas.</div></div><span class="btn sm">Göster</span></button>`:"";})()}
  ${low.length?`<button class="notice warn item" style="border:0;border-radius:12px" data-act="low"><div class="grow"><b>${low.length} malzeme azaldı</b><div style="font-size:14px">${esc(low.slice(0,3).map(p=>p.name).join(", "))}${low.length>3?"…":""}</div></div><span class="btn sm">Sipariş listesi</span></button>`:""}
  <section class="card stack" style="gap:6px"><div class="eyebrow">Bugün</div>
    <div class="today"><span><b>${inQ}</b>giriş</span><span><b>${outQ}</b>çıkış</span><span><b>${open.length}</b>açık iş emri</span><span><b>${prods.length}</b>kayıtlı ürün</span></div></section>
  ${dueHtml()}
  <section class="stack"><div class="sectionhd"><h3>Atölyedeki araçlar</h3><button class="btn sm" data-act="wo-new">+ Araç geldi</button></div>
    ${open.length?`<div class="list">${open.slice(0,6).map(woItem).join("")}</div>`:`<div class="card empty">Atölyede araç yok. Araç gelince “Araç geldi” ile iş emri aç.</div>`}</section>
  <section class="stack"><h3>Son hareketler</h3>
    ${S.moves.length?`<div class="list">${S.moves.slice(0,5).map(moveItem).join("")}</div>`:`<div class="card empty">Henüz hareket yok. İlk malzemeyi “Malzeme geldi” ile ekle.</div>`}</section>`;
}
function dueHtml(){
  const due=[...S.vehicles.values()].filter(v=>v.nextDate&&v.nextDate-Date.now()<30*864e5).sort((a,b)=>a.nextDate-b.nextDate);
  if(!due.length)return "";
  return `<section class="stack"><div class="sectionhd"><h3>Bakımı yaklaşanlar</h3><span class="muted">${due.length} araç</span></div><div class="list">${due.slice(0,6).map(v=>{const d=Math.round((v.nextDate-Date.now())/864e5);
    return `<div class="item" style="cursor:default"><div class="grow"><div class="row"><span class="tag">${esc(v.plate)}</span><span class="t">${esc(v.model||"")}</span></div><div class="s">${esc(v.owner||"")}${v.nextKm?` · ${kmFmt(v.nextKm)} km`:""} · ${d<0?`${-d} gün geçti`:`${d} gün kaldı`}</div></div>${v.phone?`<button class="btn sm" data-act="remind" data-k="${esc(plateKey(v.plate))}">Hatırlat</button>`:""}</div>`;}).join("")}</div></section>`;
}
function findItem(p){
  const [k]=stat(p),l=locsOf(p);
  return `<button class="item" data-act="prod" data-id="${esc(p.id)}">
    <div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${esc([p.brand,p.partNo].filter(Boolean).join(" · "))}</div>
    <div style="margin-top:6px;font-size:15px">${l.length?`Raf: ${l.map(([s,v])=>`<span class="tag">${esc(s)}</span> <span class="muted">${v}</span>`).join(" &nbsp;")}`:`<span class="pill bad">Depoda yok</span>`}</div></div>
    <div class="qty ${k==="ok"?"":k}">${qtyOf(p)}<small>${esc(unitOf(p))}</small></div></button>`;
}
function moveItem(m){
  const t={in:["ok","Giriş"],out:["acc","Çıkış"],count:["neu","Sayım"]}[m.type]||["neu",m.type];
  return `<div class="item" style="cursor:default"><span class="pill ${t[0]}">${t[1]}</span>
    <div class="grow"><div class="t">${esc(m.name)}</div><div class="s">${fmtDate(m.ts)}${m.shelf?` · raf ${esc(m.shelf)}`:""}${m.plate?` · ${esc(m.plate)}`:""}</div></div>
    <div class="qty" style="font-size:22px">${m.type==="out"?"−"+m.qty:(m.qty>0?"+":"")+m.qty}</div></div>`;
}

/* ================= OKUT (task) ================= */
function prog(n,of){return `<div class="prog" aria-label="Adım ${n}/${of}">${Array.from({length:of},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</div>`;}
function scanBtn(label){return `${scanState()}<button class="btn pri big" data-act="scan">${IC.cam}${esc(label)}</button>
  <div class="row" style="justify-content:center"><label class="btn sm" for="gal" role="button" tabindex="0">Galeriden fotoğraf seç</label></div>
  <form class="row" data-form="manual"><input id="manual" class="grow" placeholder="veya kodu yaz / el okuyucu" autocomplete="off" enterkeyhint="go" aria-label="Kod"><button class="btn">Bul</button></form>`;}
function scanState(){
  const f=S.scan;if(!f)return "";
  if(f.state==="busy")return `<div class="notice info scanbox"><img src="${f.url}" alt=""><div><b>Okunuyor…</b><div style="font-size:14px">Fotoğraftaki kod aranıyor.</div></div></div>`;
  if(f.state==="fail")return `<div class="notice warn scanbox"><img src="${f.url}" alt=""><div class="stack" style="gap:8px"><div><b>Kod bulunamadı.</b><div style="font-size:14px">Kodu ekranın ortasına al, 15–20 cm yaklaş, gölge ve parlama olmasın.</div></div>
    ${ai?`<button class="btn sm pri" data-act="ai-read">Claude etiketi okusun</button>`:""}</div></div>`;
  if(f.state==="ai")return `<div class="notice info scanbox"><img src="${f.url}" alt=""><div><b>Claude etiketi okuyor…</b></div></div>`;
  return "";
}
function prodHead(p){return `<div class="prodhead"><div class="grow"><div class="t">${esc(p.name)}</div><div class="muted">${esc([p.brand,p.partNo].filter(Boolean).join(" · "))}</div></div><div class="qty">${qtyOf(p)}<small>depoda</small></div></div>`;}
function qtyStepper(){return `<div class="row" style="justify-content:center"><div class="stepper"><button data-act="qty" data-d="-1" aria-label="Azalt">−</button><input id="qtyIn" inputmode="numeric" value="${S.task.qty}" data-in="qty" aria-label="Adet"><button data-act="qty" data-d="1" aria-label="Arttır">+</button></div></div>`;}

function vTask(){
  const t=S.task;
  if(!t) return `${offlineNote()}<section class="stack"><h2>Ne yapacaksın?</h2>
    <div class="tiles">
      <button class="tile pri" data-act="task" data-k="in">${IC.in}<div><b>Malzeme geldi</b><br><span>Giriş yap, rafa koy</span></div></button>
      <button class="tile" data-act="task" data-k="out">${IC.out}<div><b>Malzeme al</b><br><span>Raftan çıkış ver</span></div></button>
      <button class="tile" data-act="task" data-k="find">${IC.find}<div><b>Bu ne?</b><br><span>Okut, bilgisini gör</span></div></button>
      <button class="tile" data-act="task" data-k="count">${IC.count}<div><b>Raf say</b><br><span>Rafı kontrol et</span></div></button>
    </div></section>`;
  const p=t.pid&&S.products.get(t.pid);
  const cancel=`<button class="btn link" data-act="task-end">${t.done?"Bitir":"Vazgeç"}</button>`;
  let h="";
  if(t.done){
    h=`<div class="card success"><div class="mark">${IC.check}</div><div class="ask">${esc(t.done.msg)}</div><div class="muted">${esc(t.done.sub||"")}</div>
      <div class="grid2" style="width:100%"><button class="btn pri big" data-act="task-next">${t.kind==="in"?"Sıradaki ürün":t.kind==="out"?"Başka ürün al":"Devam"}</button>${S.last?`<button class="btn big" data-act="undo">Geri al</button>`:""}</div></div>`;
  }
  else if(t.kind==="in"){
    if(!p) h=`${prog(1,2)}<div class="ask">Gelen kutunun QR'ını ya da barkodunu okut</div>
      ${scanBtn("Kutuyu okut")}
      <div class="row"><button class="btn sm" data-act="pick-prod">Listeden seç</button><button class="btn sm" data-act="prod-new">Kodu yok, yeni ürün</button></div>`;
    else {
      const l=locsOf(p);
      h=`${prog(2,2)}<div class="card stack">${prodHead(p)}</div>
      <div class="ask">Kaç ${esc(unitOf(p))} geldi?</div>${qtyStepper()}
      <div class="ask" style="font-size:24px">Hangi rafa koyuyorsun?</div>
      ${l.length?`<div class="grid2">${l.map(([s])=>`<button class="btn okb big" data-act="put" data-c="${esc(s)}">${esc(s)} rafına koy</button>`).join("")}</div><div class="muted" style="text-align:center">Bu ürün zaten bu rafta. Başka rafa koyacaksan rafı okut.</div>`:""}
      ${scanBtn("Rafın QR'ını okut")}
      <div class="row"><button class="btn sm" data-act="pick-shelf">Rafı listeden seç</button><button class="btn sm" data-act="label" data-id="${esc(p.id)}">Ürün etiketi bas</button></div>`;
    }
  }
  else if(t.kind==="out"){
    if(!t.shelf) h=`${prog(1,3)}<div class="ask">Malzemeyi alacağın rafın QR'ını okut</div>${scanBtn("Rafı okut")}<button class="btn sm" data-act="pick-shelf">Rafı listeden seç</button>`;
    else if(!p){
      const items=[...S.products.values()].filter(x=>+(x.locs||{})[t.shelf]>0);
      h=`${prog(2,3)}<div class="row"><span class="tag" style="font-size:18px">${esc(t.shelf)}</span><span class="muted">rafındasın</span><button class="btn link" data-act="shelf-reset">Rafı değiştir</button></div>
      <div class="ask">Şimdi aldığın ürünün QR'ını okut</div>${scanBtn("Ürünü okut")}
      ${items.length?`<div class="eyebrow">veya bu raftakilerden seç</div><div class="list">${items.map(x=>`<button class="item" data-act="out-pick" data-id="${esc(x.id)}"><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${esc(x.brand||"")}</div></div><div class="qty">${x.locs[t.shelf]}</div></button>`).join("")}</div>`:`<div class="notice info">Bu raf kayıtlarda boş.</div>`}`;
    } else {
      const have=+(p.locs||{})[t.shelf]||0;
      let chk;
      if(have<=0) chk=`<div class="notice bad"><b>Bu ürün ${esc(t.shelf)} rafında değil.</b> ${locsOf(p).length?`Kayıtlı yeri: ${locsOf(p).map(([s,v])=>`<b>${esc(s)}</b> (${v})`).join(", ")}`:"Depoda görünmüyor."}</div>`;
      else if(t.qty>have) chk=`<div class="notice warn">Rafta sadece ${have} ${esc(unitOf(p))} var.</div>`;
      else chk=`<div class="notice ok">Doğru raf. Sonra rafta ${have-t.qty} kalacak.</div>`;
      const open=[...S.orders.values()].filter(o=>o.status!=="tamam").sort((a,b)=>b.createdAt-a.createdAt);
      h=`${prog(3,3)}<div class="card stack">${prodHead(p)}<div class="row"><span class="muted">Raf</span><span class="tag">${esc(t.shelf)}</span><span class="muted">· burada ${have}</span></div></div>
      ${chk}
      <div class="ask">Kaç ${esc(unitOf(p))} alıyorsun?</div>${qtyStepper()}
      ${open.length?`<div class="stack" style="gap:6px"><div class="eyebrow">Hangi araca?</div><div class="chips">${open.map(o=>`<button class="chipbtn" data-act="out-order" data-id="${esc(o.id)}" aria-pressed="${t.order===o.id}">${esc(o.plate||o.no)}</button>`).join("")}<button class="chipbtn" data-act="out-order" data-id="" aria-pressed="${!t.order}">Araca değil</button></div></div>`:""}
      <button class="btn pri big" data-act="commit-out" ${have<=0||t.qty>have?"disabled":""}>Al · çıkışı ver</button>
      ${have<=0?`<button class="btn" data-act="shelf-reset">Doğru rafı okut</button>`:""}`;
    }
  }
  else if(t.kind==="find"){
    h=`<div class="ask">Ürün, kutu ya da raf QR'ını okut</div>${t.shelf?shelfContents(t.shelf):""}${scanBtn(t.shelf?"Başka şey okut":"Okut")}`;
  }
  else if(t.kind==="count") h=countBody();
  return `${offlineNote()}<section class="stack"><div class="row"><h2 class="grow">${({in:"Malzeme geldi",out:"Malzeme al",find:"Bu ne?",count:"Raf sayımı"})[t.kind]}</h2>${cancel}</div>${h}</section>`;
}
function shelfContents(code){
  const items=[...S.products.values()].filter(p=>+(p.locs||{})[code]>0);
  return `<div class="stack"><div class="row"><span class="tag" style="font-size:18px">${esc(code)}</span><span class="muted">${items.length} çeşit malzeme</span></div>
  ${items.length?`<div class="list">${items.map(findItem).join("")}</div>`:`<div class="notice info">Bu raf boş görünüyor.</div>`}</div>`;
}
function countBody(){
  const t=S.task;
  if(!t.shelf) return `${prog(1,2)}<div class="ask">Sayacağın rafın QR'ını okut</div>${scanBtn("Rafı okut")}<button class="btn sm" data-act="pick-shelf">Rafı listeden seç</button>`;
  const seen=t.seen||(t.seen={});
  const ids=[...new Set([...[...S.products.values()].filter(p=>+(p.locs||{})[t.shelf]>0).map(p=>p.id),...Object.keys(seen)])];
  let diff=0;
  const rows=ids.map(id=>{const p=S.products.get(id);if(!p)return "";const exp=+(p.locs||{})[t.shelf]||0,got=seen[id]||0;if(got!==exp)diff++;
    const k=got===exp?"ok":got<exp?"bad":"warn";
    return `<div class="item" style="cursor:default"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">Kayıtta ${exp}</div>
      <span class="pill ${k}">${got===exp?"Tamam":got<exp?`${exp-got} eksik`:`${got-exp} fazla`}</span></div>
      <div class="stepper"><button data-act="cnt" data-id="${esc(id)}" data-d="-1" aria-label="Azalt">−</button><input value="${got}" readonly aria-label="Sayılan" style="width:56px;font-size:24px"><button data-act="cnt" data-id="${esc(id)}" data-d="1" aria-label="Arttır">+</button></div></div>`;}).join("");
  return `${prog(2,2)}<div class="row"><span class="tag" style="font-size:18px">${esc(t.shelf)}</span><span class="muted">Raftakileri okut ya da +/− ile say</span></div>
  ${ids.length?`<div class="list">${rows}</div>`:`<div class="notice info">Bu rafta kayıtlı ürün yok. Bulduklarını okut.</div>`}
  ${scanBtn("Ürünü okut (+1)")}
  <button class="btn okb big" data-act="count-save">${diff?`Kaydet · ${diff} düzeltme`:"Raf doğru · bitir"}</button>`;
}

async function saveWo(finish){
  readWo();if(!db)return false;

  if(finish){wo.status="tamam";wo.tasks.forEach(t=>t.done=true);wo.finishedAt=Date.now();}
  const ref=wo.id?db.doc("orders/"+wo.id):db.collection("orders").doc();
  const {id,_filled,...body}=wo;body.updatedAt=Date.now();delete body.vehicle;delete body.customer;

    const labor={...(S.settings.labor||{})};let ch=false;

/* ================= Labels ================= */
const LABEL_SIZES={"50x30":[50,30],"40x30":[40,30],"50x25":[50,25],"40x20":[40,20],"30x20":[30,20],"60x40":[60,40]};
const DPMM=12; // ~300 dpi; printer apps scale it to the roll exactly
function labelDims(){const k=LABEL_SIZES[S.settings.labelSize]?S.settings.labelSize:"50x30",[w,h]=LABEL_SIZES[k];return {W:w*DPMM,H:h*DPMM,w,h,k:k.replace("x","×")};}
function drawQR(ctx,text,x,y,size){
  const q=qrcode(0,"M");q.addData(text);q.make();const n=q.getModuleCount(),quiet=2,cell=Math.floor(size/(n+quiet*2)),off=Math.floor((size-cell*(n+quiet*2))/2);
  ctx.fillStyle="#fff";ctx.fillRect(x,y,size,size);ctx.fillStyle="#000";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(x+off+(c+quiet)*cell,y+off+(r+quiet)*cell,cell,cell);
}
function wrap(ctx,text,maxW,maxLines){
  const words=String(text).split(/\s+/),lines=[];let cur="";
  for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width<=maxW)cur=t;else{if(cur)lines.push(cur);cur=w;}}
  if(cur)lines.push(cur);
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].slice(0,-1)+"…";}
  return lines;
}
function labelBase(){
  const {W,H}=labelDims(),c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  const pad=Math.round(H*.05),qs=H-2*pad,tx=pad+qs+Math.round(H*.04),tw=W-tx-pad;
  x.fillStyle="#000";x.textBaseline="top";return {c,x,W,H,pad,qs,tx,tw};
}
function productLabel(p){
  const {c,x,H,pad,qs,tx,tw}=labelBase();drawQR(x,"MD:P:"+p.id,pad,pad,qs);x.fillStyle="#000";
  const fs=Math.round(H*.115);x.font=`700 ${fs}px 'Barlow Condensed','Arial Narrow',sans-serif`;
  const loc=locsOf(p)[0]?.[0],bottom=loc?H-pad-Math.round(fs*1.15):H-pad;
  let y=pad+2;
  const nameLines=wrap(x,p.name.toLocaleUpperCase("tr"),tw,Math.max(1,Math.floor((bottom-pad)*.62/fs)));
  nameLines.forEach(l=>{x.fillText(l,tx,y);y+=Math.round(fs*1.02);});
  const sf=Math.round(fs*.62);x.font=`500 ${sf}px 'Barlow',Arial,sans-serif`;y+=Math.round(sf*.2);
  for(const t of [p.brand,p.partNo].filter(Boolean)){if(y+sf>bottom)break;wrap(x,t,tw,1).forEach(l=>x.fillText(l,tx,y));y+=Math.round(sf*1.15);}
  if(loc){const lf=Math.round(fs*.78);x.font=`700 ${lf}px 'JetBrains Mono',monospace`;const t="RAF "+loc,bw=Math.min(tw,x.measureText(t).width+lf*.6);
    x.lineWidth=Math.max(2,Math.round(H/120));x.strokeRect(tx,bottom,bw,Math.round(fs*1.1));x.fillText(t,tx+lf*.3,bottom+Math.round(fs*.18));}
  return c;
}
function shelfLabel(code){
  const {c,x,H,pad,qs,tx,tw}=labelBase();drawQR(x,"MD:R:"+code,pad,pad,qs);x.fillStyle="#000";
  const cf=Math.round(H*.08);x.font=`600 ${cf}px 'Barlow Condensed','Arial Narrow',sans-serif`;x.fillText("RAF",tx,pad+4);
  let fs=Math.round(H*.5);const f=()=>x.font=`700 ${fs}px 'Barlow Condensed','Arial Narrow',sans-serif`;f();
  while(x.measureText(code).width>tw&&fs>20){fs-=4;f();}
  x.fillText(code,tx,pad+cf+Math.round(H*.06));
  return c;
}

  if(!dl){toast("Görsele basılı tut, Fotoğraflara kaydet");return false;}

async function loadImg(file){
  try{return await createImageBitmap(file,{imageOrientation:"from-image"});}catch{}
  try{return await createImageBitmap(file);}catch{}
  return await new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=u;});
}
function toCanvas(img,max,crop=1,rot=0){
  const W=img.width,H=img.height,cw=W*crop,ch=H*crop,sx=(W-cw)/2,sy=(H-ch)/2,sc=Math.min(1,max/Math.max(cw,ch));
  const w=Math.round(cw*sc),h=Math.round(ch*sc),c=document.createElement("canvas");
  c.width=rot?h:w;c.height=rot?w:h;const x=c.getContext("2d",{willReadFrequently:true});
  if(rot){x.translate(h,0);x.rotate(Math.PI/2);}
  x.drawImage(img,sx,sy,cw,ch,0,0,w,h);return c;
}
let zxr=null;
function zxDecode(c){
  const Z=window.ZXing;if(!Z)return null;
  if(!zxr){const F=Z.BarcodeFormat,h=new Map();h.set(Z.DecodeHintType.TRY_HARDER,true);
    h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[F.QR_CODE,F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E,F.CODE_128,F.CODE_39,F.ITF,F.DATA_MATRIX].filter(x=>x!=null));
    zxr=new Z.MultiFormatReader();zxr.setHints(h);}
  const d=c.getContext("2d",{willReadFrequently:true}).getImageData(0,0,c.width,c.height).data,g=new Uint8ClampedArray(c.width*c.height);
  for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=(306*d[i]+601*d[i+1]+117*d[i+2]+512)>>10;
  for(const Bin of [Z.HybridBinarizer,Z.GlobalHistogramBinarizer]){
    try{const r=zxr.decodeWithState(new Z.BinaryBitmap(new Bin(new Z.RGBLuminanceSource(g,c.width,c.height))));if(r&&r.getText())return r.getText();}catch{}
  }
  return null;
}
function jsqrDecode(c){
  if(typeof jsQR!=="function")return null;
  const d=c.getContext("2d",{willReadFrequently:true}).getImageData(0,0,c.width,c.height);
  const r=jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"});return r&&r.data?r.data:null;
}
async function decodeFile(file){
  const img=await loadImg(file);if(!img)return [];
  if("BarcodeDetector" in window){try{const r=await new BarcodeDetector().detect(img);if(r.length)return r.map(x=>x.rawValue);}catch{}}
  const tries=[[1600,1,0],[1000,1,0],[1200,.55,0],[700,1,0],[1200,.55,1],[1600,1,1]];
  for(const [max,crop,rot] of tries){
    const c=toCanvas(img,max,crop,rot);
    const v=jsqrDecode(c)||zxDecode(c);
    if(v)return [v];
    await new Promise(r=>setTimeout(r,0));
  }
  return [];
}
async function aiRead(){
  const f=S.scan;if(!ai||!f?.file)return;
  f.state="ai";render();
  const shelves=sortedShelves().map(x=>x.code).slice(0,200).join(", ");
  const prompt=`Fotoğrafta bir oto servis deposundan bir etiket var. Üç olasılık:
1) Raf etiketi: QR kodun yanında büyük harflerle raf kodu yazar (ör. A3, B12). Kayıtlı raflar: ${shelves||"yok"}.
2) Ürün etiketi: QR kodun yanında ürün adı, marka ve parça numarası yazar.
3) Parça kutusu: üzerinde barkod (altında rakamlar), marka, parça numarası ve ürün adı yazar.
Etiketteki yazıları oku. Sadece şu JSON'u döndür:
{"kind":"shelf|product|barcode|none","shelf":"raf kodu veya boş","name":"ürün adı veya boş","partNo":"parça no veya boş","barcode":"barkod rakamları veya boş"}`;
  try{
    const r=await ai.json(prompt,{images:[f.file],modelTier:"quick"});
    S.scan=null;
    const sc=shelfCode(r.shelf);
    if(r.kind==="shelf"&&S.shelves.has(sc)){handleCode("MD:R:"+sc);return;}
    for(const v of [r.barcode,r.partNo]){if(v&&resolve(v)?.kind==="prod"){handleCode(v);return;}}
    if(r.name){const n=norm(r.name),m=[...S.products.values()].filter(p=>norm(p.name).includes(n)||n.includes(norm(p.name)));if(m.length===1){handleCode("MD:P:"+m[0].id);return;}}
    if(r.barcode||r.partNo){handleCode(r.barcode||r.partNo);return;}
    if(sc){toast(`“${sc}” diye bir raf kayıtlı değil`);render();return;}
    toast("Claude da etiketi okuyamadı. Kodu yazabilirsin.");render();
  }catch(e){
    S.scan={...f,state:"fail"};render();
    toast(e.code==="not_granted"||e.code==="sampling_disabled"?"Bu özellik kapalı":e.code==="images_unavailable"?"Fotoğraf gönderilemedi":"Okunamadı, tekrar dene");
  }
}
let actx=null;
function beep(ok=true){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=ok?1760:330;g.gain.value=.06;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(ok?.09:.25));}catch{}}
function resolve(raw){
  raw=String(raw).trim();if(!raw)return null;
  if(raw.startsWith("MD:R:"))return {kind:"shelf",code:raw.slice(5)};
  if(raw.startsWith("MD:P:"))return {kind:"prod",id:raw.slice(5)};
  const sc=shelfCode(raw);if(S.shelves.has(sc))return {kind:"shelf",code:sc};
  const n=norm(raw);
  for(const p of S.products.values())if((p.codes||[]).some(c=>norm(c)===n)||(p.partNo&&norm(p.partNo)===n))return {kind:"prod",id:p.id};
  const byName=[...S.products.values()].filter(p=>norm(p.name).includes(n));
  if(n.length>=3&&byName.length===1)return {kind:"prod",id:byName[0].id};
  return {kind:"unknown",code:raw};
}
function handleCode(raw){
  const r=resolve(raw);if(!r)return;
  if(r.kind==="prod"&&!S.products.has(r.id)){toast("Bu etiketin ürünü silinmiş");return;}
  buzz();
  if(!S.task)S.task={kind:"find",qty:1};
  const t=S.task;if(t.done){t.done=null;t.pid=null;if(t.kind!=="out")t.shelf=null;}
  if(t.kind==="find"){
    if(r.kind==="shelf"){t.shelf=r.code;render();}else if(r.kind==="prod")prodSheet(r.id);else prodForm(null,{code:r.code});
  } else if(t.kind==="in"){
    if(r.kind==="shelf"){if(!t.pid){toast("Önce kutuyu okut");return;}putAway(r.code);}
    else if(r.kind==="prod"){t.pid=r.id;t.qty=1;render();}
    else prodForm(null,{code:r.code});
  } else if(t.kind==="out"){
    if(r.kind==="shelf"){t.shelf=r.code;t.pid=null;render();}
    else if(r.kind==="prod"){if(!t.shelf){const l=locsOf(S.products.get(r.id));toast(l.length?`Önce rafı okut (${l.map(x=>x[0]).join(", ")})`:"Önce rafı okut");return;}t.pid=r.id;t.qty=1;render();}
    else toast("Bu kod kayıtlı bir ürün değil");
  } else if(t.kind==="count"){
    if(r.kind==="shelf"){if(t.shelf&&t.shelf!==r.code){toast("Önce bu rafın sayımını bitir");return;}t.shelf=r.code;t.seen={};render();}
    else if(r.kind==="prod"){if(!t.shelf){toast("Önce rafı okut");return;}t.seen[r.id]=(t.seen[r.id]||0)+1;toast(S.products.get(r.id).name+" +1");render();}
    else toast("Bu kod kayıtlı değil");
  }
}

async function addMove(m){return db.collection("moves").add({...m,ts:Date.now()});}
async function setStock(pid,shelf,val){await db.doc("products/"+pid).update({locs:{[shelf]:Math.max(0,val)}});}
async function putAway(shelf){
  const t=S.task,p=S.products.get(t.pid);if(!db||!p)return;
  try{
    if(!S.shelves.has(shelf))await db.doc("shelves/"+shelf).set({code:shelf,createdAt:Date.now()});
    const before=+(p.locs||{})[shelf]||0;
    await setStock(p.id,shelf,before+t.qty);
    const ref=await addMove({pid:p.id,name:p.name,type:"in",qty:t.qty,shelf});
    S.last={pid:p.id,shelf,before,moveId:ref.id};
    t.done={msg:`${t.qty} ${unitOf(p)} ${p.name}`,sub:`${shelf} rafına kondu`};render();
  }catch(e){fail(e,"Giriş");}
}
async function commitOut(){
  const t=S.task,p=S.products.get(t.pid);if(!db||!p)return;
  const o=t.order&&S.orders.get(t.order);
  try{
    const before=+(p.locs||{})[t.shelf]||0;
    await setStock(p.id,t.shelf,before-t.qty);
    const ref=await addMove({pid:p.id,name:p.name,type:"out",qty:t.qty,shelf:t.shelf,orderId:o?.id||"",plate:o?.plate||""});
    if(o)await db.doc("orders/"+o.id).update({parts:[...(o.parts||[]),{pid:p.id,name:p.name,qty:t.qty,shelf:t.shelf,price:+p.price||0}]});
    S.last={pid:p.id,shelf:t.shelf,before,moveId:ref.id,orderId:o?.id};
    const left=before-t.qty,m=+p.min||0;
    t.done={msg:`${t.qty} ${unitOf(p)} ${p.name} alındı`,sub:`${o?o.plate+" için · ":""}${t.shelf} rafında ${left} kaldı${m&&left<=m?" · sipariş zamanı":""}`};render();
  }catch(e){fail(e,"Çıkış");}
}
async function undo(){
  const l=S.last;if(!l||!db)return;
  try{
    await setStock(l.pid,l.shelf,l.before);await db.doc("moves/"+l.moveId).delete();
    if(l.orderId){const o=S.orders.get(l.orderId);if(o){const parts=[...(o.parts||[])];parts.pop();await db.doc("orders/"+o.id).update({parts});}}
    S.last=null;const t=S.task;t.done=null;render();toast("Geri alındı");
  }catch(e){fail(e,"Geri alma");}
}
async function saveCount(){
  const t=S.task;if(!db||!t.shelf)return;
  const ids=new Set([...[...S.products.values()].filter(p=>+(p.locs||{})[t.shelf]>0).map(p=>p.id),...Object.keys(t.seen||{})]);
  let n=0;
  try{
    for(const id of ids){const p=S.products.get(id);if(!p)continue;const exp=+(p.locs||{})[t.shelf]||0,got=t.seen[id]||0;
      if(exp!==got){await setStock(id,t.shelf,got);await addMove({pid:id,name:p.name,type:"count",qty:got-exp,shelf:t.shelf});n++;}}
    S.last=null;t.done={msg:`${t.shelf} sayıldı`,sub:n?`${n} ürün düzeltildi`:"Her şey kayıtlarla aynı"};render();
  }catch(e){fail(e,"Sayım");}
}

const FS=isNative?Cap.registerPlugin("Filesystem"):null,SH=isNative?Cap.registerPlugin("Share"):null,APP=isNative?Cap.registerPlugin("App"):null;
const DB_FILE="servis-depo.json";

function makeDB(){
  const data={},subs=new Set();
  const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const split=p=>{const a=p.split("/");return [a.slice(0,-1).join("/"),a[a.length-1]];};
  const snapDoc=(col,id)=>{const d=data[col]&&data[col][id];return {id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}};};
  function snapCol(col,o){
    let docs=Object.keys(data[col]||{}).map(id=>snapDoc(col,id));
    if(o.order){const [f,dir]=o.order;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return (x>y?1:x<y?-1:0)*(dir==="desc"?-1:1);});}
    if(o.limit)docs=docs.slice(0,o.limit);
    return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}};
  }
  function notify(col){subs.forEach(s=>{if(s.col!==col)return;try{s.fn(s.kind==="doc"?snapDoc(col,s.id):snapCol(col,s.o));}catch(e){console.warn(e);}});schedulePersist();}
  function merge(t,s){for(const k in s){const v=s[k];if(v&&typeof v==="object"&&!Array.isArray(v)&&t[k]&&typeof t[k]==="object"&&!Array.isArray(t[k]))merge(t[k],v);else t[k]=clone(v);}return t;}
  const docRef=(col,id)=>({id,path:col+"/"+id,
    async get(){return snapDoc(col,id);},
    async set(v){(data[col]=data[col]||{})[id]=clone(v);notify(col);},
    async update(v){const cur=data[col]&&data[col][id];if(!cur)throw {code:"invalid_argument",message:"Kayıt yok"};data[col][id]=merge(clone(cur),v);notify(col);},
    async delete(){if(data[col])delete data[col][id];notify(col);},
    onSnapshot(fn){const s={kind:"doc",col,id,fn};subs.add(s);setTimeout(()=>fn(snapDoc(col,id)),0);return ()=>subs.delete(s);}});
  const colRef=(col,o={})=>({path:col,
    doc:id=>docRef(col,id||newId()),
    async add(v){const r=docRef(col,newId());await r.set(v);return r;},
    orderBy:(f,dir="asc")=>colRef(col,{...o,order:[f,dir]}),
    limit:n=>colRef(col,{...o,limit:n}),
    async get(){return snapCol(col,o);},
    onSnapshot(fn){const s={kind:"col",col,o,fn};subs.add(s);setTimeout(()=>fn(snapCol(col,o)),0);return ()=>subs.delete(s);}});
  return {doc:p=>{const [c,i]=split(p);return docRef(c,i);},collection:p=>colRef(p),_data:data,
    _load(obj){Object.keys(data).forEach(k=>delete data[k]);Object.assign(data,clone(obj||{}));const cols=new Set([...Object.keys(data),...[...subs].map(s=>s.col)]);cols.forEach(notify);}};
}

function frameCanvas(src,max,crop=1,rot=0){
  const W=src.videoWidth||src.width,H=src.videoHeight||src.height;
  const cw=W*crop,ch=H*crop*(crop<1?.75:1),sx=(W-cw)/2,sy=(H-ch)/2,sc=Math.min(1,max/Math.max(cw,ch));
  const w=Math.round(cw*sc),h=Math.round(ch*sc),c=document.createElement("canvas");
  c.width=rot?h:w;c.height=rot?w:h;const x=c.getContext("2d",{willReadFrequently:true});
  if(rot){x.translate(h,0);x.rotate(Math.PI/2);}
  x.drawImage(src,sx,sy,cw,ch,0,0,w,h);return c;
}

async function scanLoop(){

function preprocess(c){
  const x=c.getContext("2d",{willReadFrequently:true}),d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const g=(306*p[i]+601*p[i+1]+117*p[i+2])>>10,v=g<128?Math.max(0,g*1.15-25):Math.min(255,g*1.15);p[i]=p[i+1]=p[i+2]=v;}
  x.putImageData(d,0,0);return c;
}
async function runOcr(c){
  const out=$("#ocrOut");if(!out)return;
  out.innerHTML=`<div class="notice info">Yazılar okunuyor… İlk seferde 10–20 saniye sürebilir.</div>`;
  try{
    const w=await getOcr();
    const {data}=await w.recognize(preprocess(c));
    const lines=(data.text||"").split("\n").map(l=>l.replace(/[|_~^`"“”]+/g," ").replace(/\s+/g," ").trim()).filter(l=>l.length>=2&&/[A-Za-zÇĞİÖŞÜçğıöşü0-9]{2}/.test(l));
    const words=[];lines.forEach(l=>l.split(" ").forEach(t=>{t=t.replace(/^[^\wÇĞİÖŞÜçğıöşü]+|[^\wÇĞİÖŞÜçğıöşü.\-/]+$/g,"");if(t.length>=2&&!words.includes(t))words.push(t);}));
    ocrItems=[...new Set([...lines.filter(l=>l.includes(" ")),...words])].slice(0,60);
    const up=data.text.toLocaleUpperCase("tr");
    const brand=BRANDS.find(b=>new RegExp("(^|[^A-ZÇĞİÖŞÜ])"+b.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^A-ZÇĞİÖŞÜ]|$)").test(up));
    if(brand&&$("#pBrand")&&!$("#pBrand").value.trim())$("#pBrand").value=brand.charAt(0)+brand.slice(1).toLocaleLowerCase("tr");
    const part=words.find(t=>/\d/.test(t)&&/[A-Za-z]/.test(t)&&t.length>=5&&t.length<=20)||words.find(t=>/^\d[\d.\- ]{5,18}\d$/.test(t));
    if(part&&$("#pPart")&&!$("#pPart").value.trim())$("#pPart").value=part;
    drawOcr(brand,part);
  }catch(e){console.warn(e);out.innerHTML=`<div class="notice warn">Yazılar okunamadı. Daha yakından, ışıkta tekrar çek.</div>`;}
}
function drawOcr(brand,part){
  const out=$("#ocrOut");if(!out)return;
  if(!ocrItems.length){out.innerHTML=`<div class="notice warn">Yazı bulunamadı. Yazılı yüzü çerçeveye al, yaklaş ve tekrar dene.</div>`;return;}
  const T=[["pName","Ad"],["pBrand","Marka"],["pPart","Parça no"],["pNotes","Not"]];
  out.innerHTML=`<div class="card stack" style="gap:8px">
    ${brand||part?`<div class="notice ok" style="font-size:14px">${brand?`Marka: <b>${esc($("#pBrand").value)}</b> `:""}${part?`Parça no: <b>${esc(part)}</b>`:""} — kontrol et.</div>`:""}
    <div style="font-size:14px">Önce hangi alana yazılacağını seç, sonra kelimelere dokun:</div>
    <div class="chips">${T.map(([id,l])=>`<button class="chipbtn" type="button" data-act="ocr-target" data-t="${id}" aria-pressed="${ocrTarget===id}">${l}</button>`).join("")}</div>
    <div class="chips ocrwords">${ocrItems.map((w,i)=>`<button class="chipbtn" type="button" data-act="ocr-word" data-i="${i}">${esc(w)}</button>`).join("")}</div>
    <button class="btn sm" type="button" data-act="ocr-clear">Seçili alanı temizle</button></div>`;
}

/* ---------- Yedek ---------- */
async function exportBackup(){
  await persist();
  const json=JSON.stringify({app:"servis-depo",v:1,exportedAt:Date.now(),data:db._data});
  try{
    await shareFile.save({filename:`servis-depo-yedek-${new Date().toISOString().slice(0,10)}.json`,data:new Blob([json],{type:"application/json"})});
    S.settings={...S.settings,lastBackup:Date.now()};await db.doc("settings/main").set(S.settings);
    toast("Yedek hazırlandı");
  }catch(e){if(!/cancel/i.test(e?.message||""))toast("Yedek gönderilemedi");}
}
async function importBackup(file){
  try{
    const o=JSON.parse(await file.text());
    if(!o||o.app!=="servis-depo"||!o.data)throw new Error("format");
    const n=Object.keys(o.data.products||{}).length,m=Object.keys(o.data.orders||{}).length;
    S.pendingRestore=o.data;
    openSheet(`${sheetHd("Yedek yüklensin mi?")}
      <p style="margin:0">Yedek tarihi: <b>${new Date(o.exportedAt||o.savedAt||Date.now()).toLocaleString("tr-TR")}</b><br>${n} ürün, ${m} iş emri.</p>
      <div class="notice warn">Bu telefondaki mevcut kayıtların yerine geçer.</div>
      <div class="grid2"><button class="btn pri big" data-act="restore-ok">Evet, yükle</button><button class="btn big" data-act="close">Vazgeç</button></div>`);
  }catch{toast("Bu dosya Servis Depo yedeği değil");}
}

/* ================= Boot ================= */
$("#restoreIn").addEventListener("change",ev=>{const f=ev.target.files?.[0];ev.target.value="";if(f)importBackup(f);});
render();
(async()=>{
  db=makeDB();dl=shareFile;ai=null;
  await loadDB();
  const loaded=new Set();
  const done=k=>{loaded.add(k);if(loaded.size>=6)S.ready=true;render();};
  db.collection("products").onSnapshot(s=>{S.products=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));done("p");});
  db.collection("shelves").onSnapshot(s=>{S.shelves=new Map(s.docs.map(d=>[d.id,{...d.data(),code:d.data().code||d.id}]));done("s");});
  db.collection("staff").onSnapshot(s=>{S.staff=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));done("st");});
  db.collection("orders").onSnapshot(s=>{S.orders=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));done("o");});
  db.collection("moves").orderBy("ts","desc").limit(1000).onSnapshot(s=>{S.moves=s.docs.map(d=>({id:d.id,...d.data()}));done("m");});
  db.collection("vehicles").onSnapshot(s=>{S.vehicles=new Map(s.docs.map(d=>[d.id,{...d.data()}]));done("v");});
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?{...s.data()}:{};if(S.view==="ayar")render();});
  document.addEventListener("visibilitychange",()=>{if(document.hidden){persist();closeScanner();}});
  if(APP){
    APP.addListener("pause",()=>{persist();closeScanner();});
    APP.addListener("backButton",()=>{
      if(!$("#scanner").hidden){closeScanner();return;}
      if(sheetOpen){closeSheet();return;}
      if(S.view==="task"&&S.task){S.task=null;render();return;}
      if(S.view!=="home"){S.view="home";render();return;}
      APP.exitApp();
    });
  }
})();
})();
</script>
