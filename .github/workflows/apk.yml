name: APK oluştur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Kütüphaneleri kur
        run: npm ci

      - name: Uygulama dosyalarını hazırla
        run: npm run build

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK kontrol
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon > ../gradle.log 2>&1
          code=$?
          tail -n 60 ../gradle.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E -A12 "What went wrong|error:|^e: |Execution failed|Could not" ../gradle.log | head -n 60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=Gradle::$msg"
            exit $code
          fi

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk servis-depo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: servis-depo-apk
          path: servis-depo.apk

      - name: İndirme sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Servis Depo 1.0.${{ github.run_number }}
          body: Telefona indirip kurun. Eski sürümün üstüne kurulur, kayıtlar silinmez.
          files: servis-depo.apk
          make_latest: true
